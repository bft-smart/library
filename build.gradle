// Root build for the BFT-SMaRt multi-module project.
//
// The project is split so that the networking transport can be swapped without
// touching the protocol layers:
//   * bftsmart-core - consensus / TOM / reconfiguration + the networking SPI
//                     (bftsmart.communication.CommunicationFactory and friends).
//   * bftsmart-tls  - the default transport (TLS sockets + Netty) and the runnable
//                     demos / tests / benchmarks. Depends on bftsmart-core.
//
// To plug in a different transport (e.g. Apache Pekko), add a new module that
// depends on bftsmart-core and provides its own CommunicationFactory implementation.

subprojects {
	apply plugin: 'java-library'

	group = 'BFT-SMaRt'
	version = '2.0'

	java {
		sourceCompatibility = JavaLanguageVersion.of(8)
		targetCompatibility = JavaLanguageVersion.of(8)
	}

	repositories {
		mavenCentral()
	}

	tasks.withType(Javadoc) {
		failOnError false
		options.addStringOption('Xdoclint:none', '-quiet')
		options.addStringOption('encoding', 'UTF-8')
		options.addStringOption('charSet', 'UTF-8')
	}
}
